name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: interactive_bible
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: interactive_bible_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U interactive_bible"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://interactive_bible@localhost:54329/interactive_bible
      TEST_DATABASE_URL: postgresql+psycopg://interactive_bible@localhost:54329/interactive_bible_test
      GEMINI_API_KEY: ""  # the suite fakes every AI call and blocks Google hosts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ffmpeg (media and story-video tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Cache Bible texts
        uses: actions/cache@v4
        with:
          path: data/bible
          key: bible-data-${{ hashFiles('scripts/fetch_data.sh') }}

      - name: Download Bible texts (public domain) and cross references (CC-BY)
        run: scripts/fetch_data.sh

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Create the development database
        run: psql -h localhost -p 54329 -U interactive_bible -d interactive_bible_test -c "CREATE DATABASE interactive_bible"

      - name: Run the test suite
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Web app (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build
