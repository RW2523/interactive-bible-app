name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't include API keys, passwords or private content. Security problems go to
        **Security → Report a vulnerability** instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Read & verse insights, Search & Ask, Library / adding content, YouTube links, Explore (atlas / timeline / stories), Sermon Studio, Admin & review, Setup / installation, Other]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "1. Open …  2. Click …  3. See …"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Anything from the screen, `.data/logs/api.log` or `.data/logs/worker.log` (remove keys and personal data).
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15 / Chrome 140 / commit abc1234 / Gemini key set: yes"
