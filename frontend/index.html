<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ec" />
    <meta name="description" content="Interactive Bible App — read Scripture with context, explore the Bible world on a living atlas, and prepare sermons. Runs locally." />
    <title>Interactive Bible App</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ibible_theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = t;
          if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0b1426");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
